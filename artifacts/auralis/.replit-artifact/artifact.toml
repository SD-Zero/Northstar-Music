kind = "web"
previewPath = "/"
title = "Auralis Music Player"
version = "1.0.0"
id = "artifacts/auralis"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24125

[services.development]
run = "pnpm --filter @workspace/auralis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auralis", "run", "build" ]
serve = "static"
publicDir = "artifacts/auralis/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24125"
BASE_PATH = "/"
